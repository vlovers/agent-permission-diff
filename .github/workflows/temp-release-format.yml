name: Temporary release formatting preview
on:
  pull_request:
    paths:
      - .github/workflows/temp-release-format.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx --no-install prettier --write CHANGELOG.md docs/release-readiness-v0.4.md test/package-smoke.test.mjs
          git diff -- CHANGELOG.md docs/release-readiness-v0.4.md test/package-smoke.test.mjs
