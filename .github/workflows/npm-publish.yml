name: Publish RuleWitness to npm
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json","utf8"));
            const tag = process.env.RELEASE_TAG;
            if (pkg.name !== "rulewitness" || tag !== "v" + pkg.version || !/^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$/.test(tag)) {
              console.error("Release tag does not match package name/version"); process.exit(1);
            }
          '
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Ensure npm supports Trusted Publishing
        run: npm install --global npm@^11
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify build and package
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run test:package
          npm run format:check
          node dist/cli.js scan HEAD --json
          npm pack --dry-run
      - name: Verify registry availability and block existing versions
        run: |
          set -eu
          npm view rulewitness versions --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/rulewitness-versions.json"
          npm view rulewitness dist-tags --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/rulewitness-tags-before.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/rulewitness-versions.json", "utf8"));
            if (!Array.isArray(versions) || !versions.every(v => typeof v === "string")) {
              console.error("Unexpected npm registry version response"); process.exit(1);
            }
            if (versions.includes(pkg.version)) {
              console.error("Package version is already published"); process.exit(1);
            }
          '
      - name: Publish using npm OIDC
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public --tag latest ;;
          esac
      - name: Verify published version and registry dist-tags
        env:
          REGISTRY_URL: https://registry.npmjs.org/
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          case "$VERSION" in
            *-*) EXPECTED_TAG=next ;;
            *) EXPECTED_TAG=latest ;;
          esac
          export VERSION EXPECTED_TAG
          # npm registry reads may lag after publish; retries never republish.
          for attempt in 1 2 3 4 5 6; do
            if npm view "rulewitness@$VERSION" version --json --registry="$REGISTRY_URL" > "$RUNNER_TEMP/published-version.json" &&
               npm view rulewitness dist-tags --json --registry="$REGISTRY_URL" > "$RUNNER_TEMP/rulewitness-tags-after.json" &&
               node --input-type=module -e '
                 import fs from "node:fs";
                 const temp = process.env.RUNNER_TEMP;
                 const version = process.env.VERSION;
                 const expectedTag = process.env.EXPECTED_TAG;
                 const published = JSON.parse(fs.readFileSync(temp + "/published-version.json", "utf8"));
                 const before = JSON.parse(fs.readFileSync(temp + "/rulewitness-tags-before.json", "utf8"));
                 const after = JSON.parse(fs.readFileSync(temp + "/rulewitness-tags-after.json", "utf8"));
                 if (published !== version || !after || after[expectedTag] !== version) process.exit(1);
                 if (expectedTag === "next" && before.latest !== after.latest) {
                   console.error("Prerelease unexpectedly changed npm latest tag"); process.exit(1);
                 }
               '; then
              echo "Verified rulewitness@$VERSION on npm dist-tag $EXPECTED_TAG"
              exit 0
            fi
            echo "npm registry has not converged (attempt $attempt/6)"
            sleep 10
          done
          echo "Published package could not be verified against npm registry" >&2
          exit 1
