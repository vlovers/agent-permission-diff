name: Published rc.3 consumer verification
on:
  pull_request:
    paths:
      - .github/workflows/verify-published-rc3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-published-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify immutable version, npm tags and published integrity
        shell: bash
        run: |
          set -euo pipefail
          registry=https://registry.npmjs.org/
          cache="$RUNNER_TEMP/registry-cache"
          npm view rulewitness dist-tags --json --registry="$registry" --prefer-online --cache="$cache" > "$RUNNER_TEMP/tags.json"
          npm view rulewitness@0.4.0-rc.3 version --json --registry="$registry" --prefer-online --cache="$cache" > "$RUNNER_TEMP/version.json"
          npm view rulewitness@0.4.0-rc.3 dist.integrity --json --registry="$registry" --prefer-online --cache="$cache" > "$RUNNER_TEMP/integrity.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const p=process.env.RUNNER_TEMP;
            const read=n=>JSON.parse(fs.readFileSync(p+"/"+n+".json","utf8"));
            const tags=read("tags"), version=read("version"), integrity=read("integrity");
            if(version!=="0.4.0-rc.3" || tags.next!==version || tags.latest!=="0.3.0" ||
               typeof integrity!=="string" || !integrity.startsWith("sha512-")) {
              throw Error("rc.3 was not published correctly; do not republish");
            }
            console.log("Published rc.3 verified; stable latest remains 0.3.0");
            console.log("npm dist.integrity: "+integrity);
          '
      - name: Verify isolated npm consumer and dual CLI aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ rulewitness@0.4.0-rc.3
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg=JSON.parse(fs.readFileSync("node_modules/rulewitness/package.json","utf8"));
            if(pkg.version!=="0.4.0-rc.3" || pkg.bin.rulewitness!=="dist/cli.js" ||
               pkg.bin["agent-permission-diff"]!=="dist/cli.js" ||
               pkg.exports?.["."]?.types!=="./dist/index.d.ts") {
              throw Error("Unexpected installed package manifest");
            }
            const api=await import("rulewitness");
            for(const name of ["parsePolicy","evaluate","comparePolicies","runPolicyTests"]) {
              if(typeof api[name]!=="function") throw Error("Missing installed runtime export: "+name);
            }
            console.log("Published consumer ESM and CLI metadata verified");
          '
          node node_modules/rulewitness/dist/cli.js --help > "$RUNNER_TEMP/rulewitness-help.txt"
          grep -q 'codex-review' "$RUNNER_TEMP/rulewitness-help.txt"
          ./node_modules/.bin/rulewitness --help > /dev/null
          ./node_modules/.bin/agent-permission-diff --help > /dev/null
      - name: Confirm source tag and publish ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git fetch --depth=1 origin tag v0.4.0-rc.3
          test "$(git rev-list -n 1 v0.4.0-rc.3)" = "e0b110b17ca762e3ff1c4a99b5f5bba6f200cba0"
          git merge-base --is-ancestor v0.4.0-rc.3 origin/main
