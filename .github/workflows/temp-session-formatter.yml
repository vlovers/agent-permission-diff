name: Temporary session format preview
on:
  pull_request:
    paths:
      - .github/workflows/temp-session-formatter.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx --no-install prettier --write src/session-context.ts test/session-context.test.ts docs/session-context.md README.md src/index.ts test/package-smoke.test.mjs
          git diff -- src/session-context.ts test/session-context.test.ts docs/session-context.md README.md src/index.ts test/package-smoke.test.mjs
