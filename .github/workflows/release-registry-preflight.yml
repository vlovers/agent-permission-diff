name: Release registry preflight
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/release-registry-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Read npm registry versions (fail closed)
        run: |
          set -eu
          npm view rulewitness versions --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/rulewitness-versions.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json","utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            const versions = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/rulewitness-versions.json","utf8"));
            if (pkg.name !== "rulewitness" || lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              console.error("Package and lockfile mismatch"); process.exit(1);
            }
            if (!Array.isArray(versions) || !versions.every(v => typeof v === "string")) {
              console.error("Unexpected npm versions response"); process.exit(1);
            }
            const latest = versions.at(-1) ?? "none";
            console.log("Registry responded; newest listed version: " + latest);
            console.log("Candidate: " + pkg.version);
            if (versions.includes(pkg.version)) {
              console.error("Candidate version already published"); process.exit(1);
            }
            console.log("Candidate version is not listed in npm registry");
          '
