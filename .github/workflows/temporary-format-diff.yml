name: Temporary format diff
on:
  push:
    branches:
      - feat/v04-internal-provider-contract
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          ./node_modules/.bin/prettier --write src/provider-adapter.ts test/provider-adapter.test.ts
          git diff -- src/provider-adapter.ts test/provider-adapter.test.ts
